name: Render Reels

on:
  schedule:
    - cron: '23 */2 * * *'     # every 2 hours; renders Reels scheduled in the next 4 days
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['render.mjs', 'worker.mjs', 'audio/**', 'fonts/**', '.github/workflows/render.yml']

permissions:
  id-token: write     # GitHub OIDC token = our only credential (verified by the reels-api function)
  contents: write     # only for the weekly keep-alive commit below

concurrency:
  group: render-reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm ci --no-audit --no-fund
      - name: Render pending Reels
        run: node worker.mjs
      # GitHub switches off scheduled workflows in public repos after 60 days without commits,
      # so the first scheduled run each Monday leaves a one-line heartbeat commit.
      - name: Keep-alive heartbeat
        if: github.event_name == 'schedule' && always()
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 2 ]; then
            date -u +%FT%TZ > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat && git commit -m "heartbeat" && git push
          fi
